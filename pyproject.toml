[project]
name = "rondolab"
version = "0.1.0"
description = "A reproducible football rondo and shared-policy PPO laboratory"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "torch>=2.4", "gymnasium>=1.0", "pettingzoo>=1.24", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "matplotlib>=3.9"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
